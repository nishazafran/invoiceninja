version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.17  # Node.js Docker image
    working_directory: ~/repo
    steps:
      - checkout  # Check out the code
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build project
          command: npm run build

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
