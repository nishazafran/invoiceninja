version: 2.1

jobs:
  build:
    docker:
      - image: cimg/php:8.2  # PHP 8.2 Docker image
    working_directory: ~/repo
    steps:
      - checkout  # Check out the code
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist
      - run:
          name: Run tests
          command: ./vendor/bin/phpunit --coverage-text
      - run:
          name: Build project (optional)
          command: echo "No build step required for PHP"  # You can replace this if you have a build script

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
