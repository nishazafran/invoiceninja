version: 2.1

jobs:
  build:
    docker:
      - image: cimg/php:8.2-node  # PHP + Node image
    steps:
      - checkout

      # 1. Update system and install Composer
      - run:
          name: Update System & Install Composer
          command: |
            sudo apt-get update
            sudo apt-get install composer -y

      # 2. Install PHP dependencies
      - run:
          name: Install PHP Dependencies
          command: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 3. Install Node dependencies
      - run:
          name: Install Node Dependencies
          command: npm install

      # 4. Build frontend
      - run:
          name: Build Frontend
          command: npm run production

      # 5. Laravel build optimizations
      - run:
          name: Laravel Optimizations
          command: |
            php artisan optimize
            php artisan config:cache
            php artisan route:cache

      # 6. Setup remote Docker for building images
      - setup_remote_docker

      # 7. Build Docker image
      - run:
          name: Build Docker Image
          command: docker build -t invoiceninja-app:latest .

      # 8. Save Docker image as artifact
      - run:
          name: Save Docker Image
          command: docker save invoiceninja-app:latest -o invoiceninja-app.tar

      - store_artifacts:
          path: invoiceninja-app.tar
          destination: docker-image

      # 9. Optional: save vendor and frontend build
      - store_artifacts:
          path: ./vendor
          destination: php-vendor

      - store_artifacts:
          path: ./public/build
          destination: frontend-build

      # 10. Push Docker image to Docker Hub
      - run:
          name: Login to Docker Hub
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin

      - run:
          name: Tag Docker Image
          command: docker tag invoiceninja-app:latest $DOCKERHUB_USERNAME/invoiceninja:latest

      - run:
          name: Push Docker Image
          command: docker push $DOCKERHUB_USERNAME/invoiceninja:latest
  test:
    docker:
      - image: cimg/php:8.2-node
    steps:
      - checkout
      - run:
          name: Install PHP dependencies
          command: composer install --no-interaction --prefer-dist
      - run:
          name: Run PHPUnit tests
          command: vendor/bin/phpunit --coverage-text || true 
  deploy-staging:
    machine: true
    steps:
      - checkout

      - add_ssh_keys:
          fingerprints:
            - "SHA256:B//ljIrB6AjD5JrNhkQ7lhoy4lRkEurPLKfBPugn4a0"
            - "SHA256:YXbjILChgNMR1Awwa/evGEuGaO2nJ5tY+wJhVyYyi4E"

      - run:
          name: Deploy to EC2 Staging
          command: |
            echo "Deploying to staging server..."

            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=300 \
              "$STAGING_USER@$STAGING_HOST" "bash ~/deploy_staging.sh"; then
              echo "Deployment succeeded."
            else
              echo "Deployment failed, but continuing pipeline..."
            fi
            
            echo "Deployment step finished."

workflows:
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy-staging:
          requires:
            - test
          filters:
            branches:
              only: v5-stable
