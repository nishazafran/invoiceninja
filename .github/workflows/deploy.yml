name: Deploy to Production

on:
  push:
    branches:
      - main  # Trigger deployment on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t invoiceninja:latest .

      # 4. Deploy to Production via SSH
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # Navigate to project folder on server
            cd /home/ubuntu/invoiceninja || mkdir -p /home/ubuntu/invoiceninja && cd /home/ubuntu/invoiceninja

            # Pull latest Docker image if exists
            docker pull invoiceninja:latest || true

            # Stop and remove old containers
            docker-compose down

            # Start containers with latest build
            docker-compose up -d --build

            # Clean up unused Docker resources
            docker system prune -f

      # 5. Optional: notify deployment success (can integrate Sentry or Slack)
      - name: Notify Deployment
        run: |
          echo "Deployment completed successfully!"
