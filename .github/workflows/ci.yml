version: 2.1

orbs:
  php: circleci/php@2.4.0
  node: circleci/node@5.0.0
  docker: circleci/docker@2.1.1

jobs:
  build:
    docker:
      - image: cimg/php:8.2  # PHP container
    working_directory: ~/repo

    steps:
      - checkout

      # Cache Composer dependencies
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-
      - run:
          name: Install PHP Dependencies
          command: composer install --no-interaction --prefer-dist
      - save_cache:
          paths:
            - vendor
          key: composer-v1-{{ checksum "composer.lock" }}

      # Cache Node modules
      - restore_cache:
          keys:
            - node-v1-{{ checksum "package-lock.json" }}
            - node-v1-
      - run:
          name: Install Frontend Dependencies
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs npm
            cd public && npm install
      - save_cache:
          paths:
            - public/node_modules
          key: node-v1-{{ checksum "package-lock.json" }}

      # Run backend tests
      - run:
          name: Run PHP Unit Tests
          command: php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-html coverage/

      # Run frontend tests (if any)
      - run:
          name: Run Frontend Tests
          command: |
            cd public
            npm test || echo "No frontend tests found"

      # Build Docker image
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t yourdockerhubusername/invoiceninja:latest .

      # Push Docker image to Docker Hub
      - run:
          name: Push Docker Image
          command: |
            echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USER --password-stdin
            docker push yourdockerhubusername/invoiceninja:latest

workflows:
  version: 2
  build_and_push:
    jobs:
      - build
