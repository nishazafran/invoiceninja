name: Invoice Ninja CI

on:
  push:
    branches: [ v5-stable ]
  pull_request:
    branches: [ v5-stable ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: invoiceninja_test
          MYSQL_USER: ninja
          MYSQL_PASSWORD: ninja
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      # -----------------------
      # 1. Checkout the code
      # -----------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # -----------------------
      # 2. Setup PHP
      # -----------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysql, bcmath, gd, zip
          coverage: none

      # -----------------------
      # 3. Composer install (with cache)
      # -----------------------
      - name: Setup Composer Dependencies Cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist

      # -----------------------
      # 4. Setup Node (frontend build)
      # -----------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run production

      # -----------------------
      # 5. Configure .env
      # -----------------------
      - name: Copy .env
        run: cp .env.example .env

      - name: Set Laravel App Key
        run: php artisan key:generate

      # -----------------------
      # 6. Wait for MySQL
      # -----------------------
      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 3
          done

      # -----------------------
      # 7. Run migrations (fresh + seed)
      # -----------------------
      - name: Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: ninja
          DB_PASSWORD: ninja
          DB_DATABASE: invoiceninja_test
        run: php artisan migrate:fresh --seed --force

      # -----------------------
      # 8. Run all tests
      # -----------------------
      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: ninja
          DB_PASSWORD: ninja
          DB_DATABASE: invoiceninja_test
        run: php artisan test
