name: Invoice Ninja CI/CD

on:
  push:
    branches: [ v5-stable ]
  pull_request:
    branches: [ v5-stable ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, gd, zip
          coverage: none

      # 3. Install PHP dependencies
      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 5. Install Node dependencies
      - name: Install Node Dependencies
        run: npm ci

      # 6. Build frontend production
      - name: Build Frontend
        run: npm run production

      # 7. Run backend tests (PHPUnit)
      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit --coverage-text

      # 8. Build Docker image
      - name: Build Docker Image
        run: docker build -t invoiceninja:latest .

      # 9. Push Docker image to Docker Hub
      - name: Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
          docker tag invoiceninja:latest $DOCKER_USER/invoiceninja:latest
          docker push $DOCKER_USER/invoiceninja:latest

      # 10. Save artifacts (optional)
      - name: Save Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-artifacts
          path: |
            ./Dockerfile
            ./vendor
            ./node_modules

